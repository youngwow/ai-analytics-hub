[project]
name = "ai-analytics-hub"
version = "0.2.0"
description = "Интеллектуальный аналитический центр: сбор отраслевых новостей, НПА и Telegram-дайджестов."
requires-python = ">=3.11"
dependencies = [
    "feedparser>=6.0.11",   # 6.0.11+ no longer imports the `cgi` module removed in Python 3.13
    "httpx>=0.27",
    "trafilatura>=2.0",
    "courlan>=1.3",
    "selectolax>=0.3",
    "pyyaml>=6.0",
    "telethon>=1.41,<2",
    "ollama>=0.6,<1",
    "fastapi>=0.115,<1",
    "uvicorn>=0.30,<1",
    "pydantic>=2,<3",
    "pydantic-settings>=2,<3",
    "numpy>=2,<3",       # косинусы дедупликации: 2000 кандидатов × 200 документов за один matvec
]

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.6",
]

# Not an installable package: `src/` is the package root and everything runs
# from the repo root as `python -m src <command>`.
[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = [
    "slow: slow tests, skipped in the quick loop",
    "integration: tests that exercise several modules together",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["src"]
